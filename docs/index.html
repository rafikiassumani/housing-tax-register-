<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housing Tax Register</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #eef3f1; color: #162d29; font: 16px system-ui, sans-serif }
header { background: #123c35; color: white; padding: 28px max(20px, calc((100% - 1100px)/2)) }
h1, h2, p { margin: 0 }
main { max-width: 1140px; padding: 24px 20px; margin: auto; display: grid; gap: 20px }
section, .metric { background: white; border: 1px solid #d4e0dc; border-radius: 12px; padding: 20px }
.metrics, .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.metric strong { display: block; margin-top: 6px; font-size: 1.55rem }
form, .search, .scroll { margin-top: 16px }
label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem }
input, button { font: inherit; padding: 9px 11px; border-radius: 6px }
input { min-width: 0; width: 100%; border: 1px solid #819993 }
button { background: #145b4e; color: white; border: 0; cursor: pointer }
button:disabled { opacity: .6; cursor: wait }
form > button { margin-top: 12px }
.search { max-width: 340px }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; text-align: left }
th, td { padding: 12px; border-bottom: 1px solid #e1e8e5; white-space: nowrap }
th { background: #f1f6f4 }
.notice { padding: 10px 12px; background: #dcebe6; border-radius: 6px }
.error { background: #ffebe5; color: #752918 }
.payment { display: flex; gap: 8px; align-items: center; margin: 0 }
.payment input { width: 105px }
.payment button { margin: 0 }

:root { color-scheme: light; }
header h1 { font-size: clamp(1.65rem, 4vw, 2.3rem); line-height: 1.15; }
header p { margin-top: 8px; color: #dcebe6; }
main { grid-template-columns: minmax(0, 1fr); }
section { min-width: 0; }
h2 { font-size: 1.25rem; }
input, button { min-height: 44px; }
:focus-visible { outline: 3px solid #087e6c; outline-offset: 3px; }
.metric { overflow-wrap: anywhere; }
th, td { white-space: normal; overflow-wrap: anywhere; }
td:nth-child(n+4):nth-child(-n+6) { white-space: nowrap; font-variant-numeric: tabular-nums; }
.cell-label { display: none; }
.empty { text-align: center; color: #4c635e; padding: 24px 12px; }
.notice { position: sticky; top: 8px; z-index: 1; border: 1px solid currentColor; }
@media (max-width: 760px) {
  header { padding: 24px 16px; }
  main { padding: 16px; gap: 16px; }
  section, .metric { padding: 14px; }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .metric { font-size: .85rem; }
  .metric strong { font-size: clamp(1rem, 3.8vw, 1.35rem); }
  .scroll { overflow: visible; }
  table, tbody { display: block; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  tbody { display: grid; gap: 12px; }
  tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 1px solid #d4e0dc; border-radius: 8px; padding: 10px; }
  tbody td { display: block; padding: 6px; border: 0; }
  tbody td:nth-child(2), tbody td:last-child { grid-column: 1 / -1; }
  .cell-label { display: block; margin-bottom: 3px; font-size: .8rem; color: #4c635e; }
  .payment input { width: auto; max-width: 10rem; }
}
</style>
</head>
<body>
<header><h1>Housing Tax Register</h1><p>Demo · Use fictional records. Changes are saved in this browser.</p></header>
<main id="root"></main>
<script type="module">
import React, {useEffect, useState} from "https://esm.sh/react@19.1.1";
import {createRoot} from "https://esm.sh/react-dom@19.1.1/client?deps=react@19.1.1";

const h = React.createElement;
const usd = new Intl.NumberFormat("en-US", {style: "currency", currency: "USD"});
const money = cents => usd.format(cents / 100);
const hundredths = value => Math.round(Number(value) * 100);
const decimal = {type: "number", step: "0.01"};
const field = (label, name, options) =>
  h("label", {key: name}, label, h("input", {name, required: true, ...options}));

const storageKey = "housing-tax-register-demo-v1";

async function request(path, data) {
  const records = JSON.parse(localStorage.getItem(storageKey) ?? "[]");
  if (path === "/api/assessments" && data === undefined) return records;

  let saved;
  if (path === "/api/assessments") {
    const parcel = data.parcel.trim().toUpperCase();
    const address = data.address.trim();
    if (!parcel || !address) throw new Error("Enter a parcel and address.");
    if (records.some(item => item.parcel === parcel && item.year === data.year)) {
      throw new Error("This parcel already has an assessment for that year.");
    }
    saved = {
      ...data, parcel, address, id: crypto.randomUUID(),
      taxCents: Number((BigInt(data.valueCents) * BigInt(data.rateBP) + 5000n) / 10000n),
      paidCents: 0
    };
    records.push(saved);
  } else {
    const item = records.find(item => item.id === data.id);
    if (!item) throw new Error("Assessment not found.");
    if (!Number.isSafeInteger(data.cents) || data.cents < 1 ||
        data.cents > item.taxCents - item.paidCents) {
      throw new Error("Payment must be positive and within the outstanding balance.");
    }
    item.paidCents += data.cents;
    saved = item;
  }

  localStorage.setItem(storageKey, JSON.stringify(records));
  return saved;
}

function App() {
  const [items, setItems] = useState([]);
  const [search, setSearch] = useState("");
  const [notice, setNotice] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    request("/api/assessments").then(setItems)
      .catch(error => setNotice({error: true, text: error.message}))
      .finally(() => setLoading(false));
  }, []);

  async function submit(event, action, message) {
    event.preventDefault();
    const form = event.currentTarget;
    setBusy(true);
    setNotice(null);
    try {
      const saved = await action(new FormData(form));
      setItems(current => current.some(item => item.id === saved.id)
        ? current.map(item => item.id === saved.id ? saved : item)
        : [...current, saved]);
      form.reset();
      setNotice({text: message});
    } catch (error) {
      setNotice({error: true, text: error.message});
    } finally {
      setBusy(false);
    }
  }

  const assessed = items.reduce((sum, item) => sum + item.taxCents, 0);
  const collected = items.reduce((sum, item) => sum + item.paidCents, 0);
  const metrics = [["Tax assessed", assessed], ["Collected", collected], ["Outstanding", assessed - collected]];
  const query = search.trim().toLowerCase();
  const visible = items.filter(item =>
    [item.parcel, item.address, item.year].join(" ").toLowerCase().includes(query));
  const headings = ["Parcel", "Address", "Year", "Tax", "Paid", "Balance", "Payment"];

  const rows = visible.map(item => {
    const balance = item.taxCents - item.paidCents;
    const payment = balance === 0 ? "Settled" : h("form", {
      className: "payment",
      onSubmit: event => submit(event, data => request("/api/payments", {
        id: item.id, cents: hundredths(data.get("amount"))
      }), "Payment recorded.")
    },
    h("input", {...decimal, required: true, name: "amount", min: "0.01",
      max: (balance / 100).toFixed(2), placeholder: "0.00",
      "aria-label": "Payment amount for " + item.parcel + ", " + item.year}),
    h("button", {disabled: busy}, "Record"));
    const cells = [item.parcel, item.address, item.year, money(item.taxCents),
      money(item.paidCents), money(balance), payment];
    return h("tr", {key: item.id, role: "row"}, cells.map((value, index) =>
      h("td", {key: headings[index], role: "cell"},
        h("span", {className: "cell-label", "aria-hidden": true}, headings[index]), value)));
  });

  const emptyRow = h("tr", {role: "row"}, h("td", {role: "cell", className: "empty", colSpan: headings.length},
    loading ? "Loading assessments…" : query ? "No assessments match your search." : "No assessments yet. Add one using the form above."));

  return h(React.Fragment, null,
    h("div", {className: "metrics"}, metrics.map(([label, value]) =>
      h("div", {className: "metric", key: label}, label,
        h("strong", null, loading ? "…" : money(value))))),
    notice && h("p", {
      role: notice.error ? "alert" : "status",
      className: notice.error ? "notice error" : "notice"
    }, notice.text),
    h("section", null,
      h("h2", null, "Add assessment"),
      h("form", {onSubmit: event => submit(event, data => request("/api/assessments", {
        parcel: data.get("parcel"), address: data.get("address"), year: Number(data.get("year")),
        valueCents: hundredths(data.get("value")), rateBP: hundredths(data.get("rate"))
      }), "Assessment saved.")},
      h("div", {className: "fields"},
        field("Parcel ID", "parcel", {maxLength: 80}),
        field("Property address", "address", {maxLength: 200}),
        field("Tax year", "year", {type: "number", min: 1900, max: 2200,
          defaultValue: new Date().getFullYear()}),
        field("Assessed value ($)", "value", {...decimal, min: "0.01", max: "1000000000"}),
        field("Tax rate (%)", "rate", {...decimal, min: "0", max: "100"})),
      h("button", {disabled: busy || loading}, "Add assessment"))),
    h("section", null,
      h("h2", null, "Property assessments"),
      h("label", {className: "search"}, "Search parcel, address, or year",
        h("input", {type: "search", value: search, onChange: event => setSearch(event.target.value)})),
      h("div", {className: "scroll"}, h("table", {role: "table", "aria-label": "Property assessments"},
        h("thead", {role: "rowgroup"}, h("tr", {role: "row"}, headings.map(label =>
          h("th", {key: label, scope: "col", role: "columnheader"}, label)))),
        h("tbody", {role: "rowgroup"}, rows.length ? rows : emptyRow)))));
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
