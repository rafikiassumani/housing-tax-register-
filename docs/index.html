<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housing Tax Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<style>
:root { color-scheme: light; --ink:#17342f; --muted:#526960; --line:#dbe4de; --green:#155949; --paper:#f3f6f2; }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "DM Sans",system-ui,sans-serif }
h1,h2,p { margin:0 }
header { color:#fff; background:radial-gradient(ellipse at 91% 120%,#27755f 0,transparent 57%),#103b34; }
.header-inner { max-width:1200px; margin:auto; padding:24px 24px 52px; }
header nav { display:flex; gap:6px; margin-bottom:32px; }
header nav a { color:#e1f3ec; padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:600; }
header nav a:hover { background:#ffffff20 }
header nav a[aria-current="page"] { color:#fff; background:#ffffff26; }
h1 { font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:clamp(2.35rem,6vw,4rem); line-height:1.05; letter-spacing:-.03em; }
header p { color:#d3e8df; max-width:40rem; margin-top:12px; }
main { max-width:1200px; margin:-24px auto 0; padding:0 24px 48px; display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }
section,.metric { min-width:0; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 20px #183e2d08; }
section { padding:22px; }
h2 { font-size:1.26rem; letter-spacing:-.025em; }
.metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.metric { padding:19px 20px; color:var(--muted); font-weight:700; overflow-wrap:anywhere; }
.metric strong { display:block; color:var(--ink); margin-top:4px; font-size:clamp(1.35rem,3.5vw,2.25rem); letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
.metric:nth-child(2) { background:#e9f5ed; border-color:#cfe6d7; }
.metric:nth-child(3) { background:#fbf5e8; border-color:#eee1c4; }
form,.scroll { margin-top:14px; }
.fields { display:grid; grid-template-columns:1fr 1.65fr .75fr 1fr .85fr; gap:12px; }
label { display:grid; gap:5px; font-weight:700; font-size:.86rem; }
input,button { min-height:44px; font:inherit; border-radius:8px; }
input { min-width:0; width:100%; border:1px solid #b8c9c0; background:#fbfcfb; color:var(--ink); padding:8px 11px; }
button { border:0; padding:8px 14px; background:var(--green); color:#fff; cursor:pointer; font-weight:700; white-space:nowrap; }
button:hover { background:#104637 }
button:disabled { opacity:.6; cursor:wait; }
form>button { margin-top:12px }
:focus-visible { outline:3px solid #15846c; outline-offset:3px; }
header a:focus-visible { outline-color:white; }
.section-heading { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px 18px; }
.dataset-info { color:var(--muted); margin-top:4px; }
.search { width:min(100%,310px); }
.scroll { overflow:auto; border:1px solid var(--line); border-radius:10px; }
table { width:100%; border-collapse:collapse; text-align:left; }
th,td { padding:11px 12px; overflow-wrap:anywhere; }
th { background:#edf3ef; color:#38564b; font-size:.8rem; }
tbody tr+tr { border-top:1px solid #e7ede8; }
tbody tr:hover { background:#f7faf7; }
td:first-child { font-weight:700; }
td:nth-child(n+4):nth-child(-n+6) { white-space:nowrap; font-variant-numeric:tabular-nums; }
td:nth-child(6) { font-weight:700; }
.cell-label { display:none; }
.empty { text-align:center; color:var(--muted); padding:24px 12px; }
.notice { position:sticky; top:8px; z-index:1; padding:10px 14px; background:#e2f3e7; border:1px solid #b7d9c5; border-radius:8px; }
.error { background:#fff0ea; color:#862c19; border-color:#edc0b3; }
.payment { display:flex; gap:6px; align-items:center; margin:0; }
.payment input { width:96px; }
.payment button { margin:0; }
.status { display:inline-block; color:#235740; background:#e1f1e6; border-radius:100px; padding:4px 9px; font-size:.8rem; font-weight:700; white-space:nowrap; }
.status.unpaid { color:#873b2d; background:#faeae5; }
.status.partial { color:#714900; background:#faefd5; }
@media(max-width:900px) { .fields { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media(max-width:760px) {
  .header-inner { padding:18px 16px 45px; }
  header nav { margin-bottom:22px; }
  main { padding:0 16px 32px; gap:14px; }
  section { padding:14px; }
  .metrics { gap:6px; }
  .metric { border-radius:12px; padding:10px 7px; font-size:.75rem; }
  .metric strong { font-size:clamp(.83rem,3.4vw,1.55rem); }
  .fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .scroll { overflow:visible; border:0; }
  table,tbody { display:block; }
  thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  tbody { display:grid; gap:10px; }
  tbody tr,tbody tr+tr { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid var(--line); border-radius:10px; padding:8px; }
  tbody td { display:block; padding:6px; }
  tbody td:nth-child(2),tbody td:last-child { grid-column:1 / -1; }
  .cell-label { display:block; margin-bottom:2px; font-size:.75rem; font-weight:700; color:var(--muted); }
}
@media(max-width:360px) { .fields { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><div class="header-inner">
<nav id="site-nav" aria-label="Main navigation"><a href="./">Register</a><a href="?view=demo">Demo data</a></nav>
<h1 id="page-title">Housing Tax Register</h1>
<p id="page-note">Demo · Use fictional records. Changes are saved in this browser.</p>
</div></header>
<main id="root"></main>
<script type="module">
import React, {useEffect, useState} from "https://esm.sh/react@19.1.1";
import {createRoot} from "https://esm.sh/react-dom@19.1.1/client?deps=react@19.1.1";

const h = React.createElement;
const demoView = new URLSearchParams(location.search).get("view") === "demo";
document.querySelectorAll("#site-nav a")[demoView ? 1 : 0].setAttribute("aria-current", "page");
if (demoView) {
  document.title = "Demo Data | Housing Tax Register";
  document.getElementById("page-title").textContent = "Demo data";
  document.getElementById("page-note").textContent = "Browse the original fictional housing tax assessments.";
}
const usd = new Intl.NumberFormat("en-US", {style: "currency", currency: "USD"});
const money = cents => usd.format(cents / 100);
const hundredths = value => Math.round(Number(value) * 100);
const decimal = {type: "number", step: "0.01"};
const field = (label, name, options) =>
  h("label", {key: name}, label, h("input", {name, required: true, ...options}));

const storageKey = "housing-tax-register-demo-v1";

function demoAssessments() {
  const year = new Date().getFullYear();
  const samples = [
    ["100 Alder Way", 0, 245000, 115, 0],
    ["214 Birch Lane", 0, 312000, 115, 50],
    ["38 Cedar Court", 0, 185000, 105, 100],
    ["502 Dogwood Drive", 0, 428000, 120, 25],
    ["76 Elm Place", 0, 279000, 115, 100],
    ["19 Fir Terrace", 0, 206000, 105, 0],
    ["610 Hawthorn Avenue", 0, 519000, 120, 75],
    ["84 Juniper Road", 0, 356000, 115, 50],
    ["127 Laurel Street", 0, 298000, 105, 0],
    ["360 Maple Avenue", 0, 390000, 115, 100],
    ["45 Oak Crescent", 0, 230000, 105, 25],
    ["921 Pine Boulevard", 0, 596000, 120, 0],
    ["12 Rowan Close", 1, 198000, 105, 100],
    ["62 Spruce Lane", 1, 254000, 115, 75],
    ["340 Willow Way", 1, 335000, 115, 100],
    ["708 Yew Street", 1, 462000, 120, 50],
    ["100 Alder Way", 1, 235000, 110, 100, 1],
    ["214 Birch Lane", 1, 300000, 110, 100, 2]
  ];

  return samples.map(([address, yearOffset, value, rateBP, paidPercent, parcelNumber], index) => {
    const parcel = "DEMO-" + String(parcelNumber ?? index + 1).padStart(3, "0");
    const taxYear = year - yearOffset;
    const valueCents = value * 100;
    const taxCents = Math.round(valueCents * rateBP / 10000);
    return {
      id: parcel + "-" + taxYear, parcel, address, year: taxYear, valueCents, rateBP,
      taxCents, paidCents: Math.round(taxCents * paidPercent / 100)
    };
  });
}


async function request(path, data) {
  const stored = localStorage.getItem(storageKey);
  const records = stored === null ? demoAssessments() : JSON.parse(stored);
  if (stored === null) localStorage.setItem(storageKey, JSON.stringify(records));
  if (path === "/api/assessments" && data === undefined) return records;

  let saved;
  if (path === "/api/assessments") {
    const parcel = data.parcel.trim().toUpperCase();
    const address = data.address.trim();
    if (!parcel || !address) throw new Error("Enter a parcel and address.");
    if (records.some(item => item.parcel === parcel && item.year === data.year)) {
      throw new Error("This parcel already has an assessment for that year.");
    }
    saved = {
      ...data, parcel, address, id: crypto.randomUUID(),
      taxCents: Number((BigInt(data.valueCents) * BigInt(data.rateBP) + 5000n) / 10000n),
      paidCents: 0
    };
    records.push(saved);
  } else {
    const item = records.find(item => item.id === data.id);
    if (!item) throw new Error("Assessment not found.");
    if (!Number.isSafeInteger(data.cents) || data.cents < 1 ||
        data.cents > item.taxCents - item.paidCents) {
      throw new Error("Payment must be positive and within the outstanding balance.");
    }
    item.paidCents += data.cents;
    saved = item;
  }

  localStorage.setItem(storageKey, JSON.stringify(records));
  return saved;
}

function App() {
  const [items, setItems] = useState(() => demoView ? demoAssessments() : []);
  const [search, setSearch] = useState("");
  const [notice, setNotice] = useState(null);
  const [loading, setLoading] = useState(!demoView);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (demoView) return;
    request("/api/assessments").then(setItems)
      .catch(error => setNotice({error: true, text: error.message}))
      .finally(() => setLoading(false));
  }, []);

  async function submit(event, action, message) {
    event.preventDefault();
    const form = event.currentTarget;
    setBusy(true);
    setNotice(null);
    try {
      const saved = await action(new FormData(form));
      setItems(current => current.some(item => item.id === saved.id)
        ? current.map(item => item.id === saved.id ? saved : item)
        : [...current, saved]);
      form.reset();
      setNotice({text: message});
    } catch (error) {
      setNotice({error: true, text: error.message});
    } finally {
      setBusy(false);
    }
  }

  const assessed = items.reduce((sum, item) => sum + item.taxCents, 0);
  const collected = items.reduce((sum, item) => sum + item.paidCents, 0);
  const metrics = [["Tax assessed", assessed], ["Collected", collected], ["Outstanding", assessed - collected]];
  const query = search.trim().toLowerCase();
  const visible = items.filter(item =>
    [item.parcel, item.address, item.year].join(" ").toLowerCase().includes(query));
  const headings = ["Parcel", "Address", "Year", "Tax", "Paid", "Balance", demoView ? "Status" : "Payment"];

  const rows = visible.map(item => {
    const balance = item.taxCents - item.paidCents;
    const status = balance === 0 ? "Settled" : item.paidCents === 0 ? "Unpaid" : "Partially paid";
    const badge = h("span", {className: "status " +
      (balance === 0 ? "settled" : item.paidCents === 0 ? "unpaid" : "partial")}, status);
    const payment = demoView || balance === 0 ? badge : h("form", {
      className: "payment",
      onSubmit: event => submit(event, data => request("/api/payments", {
        id: item.id, cents: hundredths(data.get("amount"))
      }), "Payment recorded.")
    },
    h("input", {...decimal, required: true, name: "amount", min: "0.01",
      max: (balance / 100).toFixed(2), placeholder: "0.00",
      "aria-label": "Payment amount for " + item.parcel + ", " + item.year}),
    h("button", {disabled: busy}, "Record"));
    const cells = [item.parcel, item.address, item.year, money(item.taxCents),
      money(item.paidCents), money(balance), payment];
    return h("tr", {key: item.id, role: "row"}, cells.map((value, index) =>
      h("td", {key: headings[index], role: "cell"},
        h("span", {className: "cell-label", "aria-hidden": true}, headings[index]), value)));
  });

  const emptyRow = h("tr", {role: "row"}, h("td", {role: "cell", className: "empty", colSpan: headings.length},
    loading ? "Loading assessments…" : query ? "No assessments match your search." : "No assessments yet. Add one using the form above."));

  return h(React.Fragment, null,
    h("div", {className: "metrics"}, metrics.map(([label, value]) =>
      h("div", {className: "metric", key: label}, label,
        h("strong", null, loading ? "…" : money(value))))),
    notice && h("p", {
      role: notice.error ? "alert" : "status",
      className: notice.error ? "notice error" : "notice"
    }, notice.text),
    !demoView && h("section", null,
      h("h2", null, "Add assessment"),
      h("form", {onSubmit: event => submit(event, data => request("/api/assessments", {
        parcel: data.get("parcel"), address: data.get("address"), year: Number(data.get("year")),
        valueCents: hundredths(data.get("value")), rateBP: hundredths(data.get("rate"))
      }), "Assessment saved.")},
      h("div", {className: "fields"},
        field("Parcel ID", "parcel", {maxLength: 80}),
        field("Property address", "address", {maxLength: 200}),
        field("Tax year", "year", {type: "number", min: 1900, max: 2200,
          defaultValue: new Date().getFullYear()}),
        field("Assessed value ($)", "value", {...decimal, min: "0.01", max: "1000000000"}),
        field("Tax rate (%)", "rate", {...decimal, min: "0", max: "100"})),
      h("button", {disabled: busy || loading}, "Add assessment"))),
    h("section", null,
      h("div", {className: "section-heading"},
        h("div", null, h("h2", null, "Property assessments"),
          !loading && h("p", {className: "dataset-info"}, query
            ? visible.length + " of " + items.length + " assessments"
            : items.length + (items.length === 1 ? " assessment" : " assessments"))),
        h("label", {className: "search"}, "Search parcel, address, or year",
          h("input", {type: "search", value: search, onChange: event => setSearch(event.target.value)}))),
      h("div", {className: "scroll"}, h("table", {role: "table", "aria-label": "Property assessments"},
        h("thead", {role: "rowgroup"}, h("tr", {role: "row"}, headings.map(label =>
          h("th", {key: label, scope: "col", role: "columnheader"}, label)))),
        h("tbody", {role: "rowgroup"}, rows.length ? rows : emptyRow)))));
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
